<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Text</title>

	<style>
		table {
			border-collapse: collapse;
			border: 1px solid #000;
			margin: 5px;
		}

		th,
		td {
			border: 1px solid #000;
		}

		table img {
			width: 150px;
		}
	</style>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>

<body>
	<h1>응답데이터 형식 : text</h1>
	<input type="button" value="실행" id="btn1">

	

	<div class="wrapper">
		<script>
			$(function () {
				$("#btn1").click(function () {
					$.ajax({
						url: "/ajax/text", // 요청을 보낼 서버주소
						data: { // 서버에 전송할 데이터
							name: "kiwi",
							num: 35,
							flag: false
						},
						method: "GET", // 요청방식(default : GET)
						dataType: "text", // 응답데이터 형식(text, html, json)
						success: function (response) {
							console.log(response);
							// res.text() 처리 완료된 데이터가 넘어옴
							$(".wrapper").html(response);
						},
						error: function (xhr, status, error) {
							console.log(xhr);
							console.log(status);
							console.log(error);
						},
						complete: function () {
							console.log("서버 요청 완료");
						}

						/*
							그 외 주요 속성
							- async : 서버와의 통신시 비동기 처리방식 여부(기본값 : true)
							- crossDomain : 타 도메인 호출가능 여부(기본값 : false)
							- contentType : request로 보내는 데이터의 인코딩 방식(기본값 : text)
							- processData : 서버로 보내는 값이 file인 경우 설정
						*/
					});
				});
			})
		</script>

	</div>

	<hr>

	<h2>응답데이터 형식 : CSV</h2>
	<input type="button" value="실행" id="btn2">

	<div class="container">
		<script>
			$("#btn2").click(function() {
				$.ajax({
					url:"/ajax/csv",
					success : function(data) {
						console.log(data);
						const $table = $("<table></table>");
						const persons = data.split("\r\n");
						persons.pop(); // 공백 데이터 제거
						console.log(persons);

						$(persons).each(function(index, person) {
							const arr = person.split(",");
							let tr = "<tr>";
									tr += "<td>"+arr[0]+"</td>";
									tr += "<td>"+arr[1]+"</td>";
									tr += "<td>"+arr[2]+"</td>";
								tr += "</tr>";
							$table.append(tr);
						});

						$table.appendTo(".container");
					},
					error : function(xhr, status, err) {
						console.log(xhr, status, err);
					}
				})
			})
		</script>
	</div>


</body>

</html>
